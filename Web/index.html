<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEAR</title>
    <style>
        :root {
            color-scheme: dark;
            --text: #e3e3e3;
            --muted: #a0a0a0;
            --accent: #a78bfa;
            --panel: #1e1f22;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #0b0d14;
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system,
                BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .app {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .top-area {
            width: min(100% - 24px, 800px);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 15vh;
        }

        /* Perfectly aligned ASCII logo */
        .bear-logo {
            margin: 0 0 35px;
            color: var(--accent);
            font-family: "Courier New", monospace;
            font-weight: 700;
            font-size: clamp(0.9rem, 2.5vw, 1.8rem); 
            line-height: 1.15; 
            letter-spacing: 0.1em; 
            text-align: center;
            white-space: pre;
            text-shadow: 0 0 25px rgba(167, 139, 250, 0.4);
        }

        .chat-shell {
            width: min(100%, 720px);
        }

        /* Modern pill-shaped chat box */
        .chat-box {
            width: 100%;
            min-height: 52px;
            padding: 8px 12px;
            border-radius: 26px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: var(--panel);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: flex-end;
            gap: 12px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .chat-box:focus-within {
            background: #232428;
            border-color: rgba(255, 255, 255, 0.15);
        }

        textarea {
            flex: 1;
            min-height: 24px;
            height: 24px;
            max-height: 150px;
            resize: none;
            border: 0;
            outline: 0;
            background: transparent;
            color: var(--text);
            font: inherit;
            font-size: 1rem;
            padding: 0;
            line-height: 24px;
            margin: 6px 0;
            overflow: hidden; /* Hides native scrollbars and extra arrows */
            -ms-overflow-style: none; /* IE and Edge */
            scrollbar-width: none; /* Firefox */
        }

        textarea::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Opera */
        }

        textarea::placeholder {
            color: var(--muted);
        }

        .right-controls {
            display: flex;
            align-items: center;
            gap: 4px;
            padding-bottom: 0px;
        }

        .effort-selector {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: var(--muted);
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 12px;
            transition: background 0.2s, color 0.2s;
            user-select: none;
        }

        .effort-selector:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
        }

        .icon-button {
            width: 36px;
            height: 36px;
            border: 0;
            border-radius: 50%;
            cursor: pointer;
            display: grid;
            place-items: center;
            flex: 0 0 36px;
            background: transparent;
            color: var(--muted);
            transition: all 0.2s ease;
        }

        .icon-button:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
        }

        .send-button {
            display: grid;
            background: rgba(255, 255, 255, 0.1);
            color: var(--muted);
            pointer-events: none;
            transition: all 0.2s ease;
        }

        .send-button.active {
            background: #f1efe9;
            color: #1a1a1a;
            pointer-events: auto;
        }

        .send-button.active:hover {
            background: #ffffff;
        }

        .tool-menu {
            position: relative;
        }

        .tool-dropdown {
            position: absolute;
            left: 0;
            bottom: 52px;
            z-index: 10;
            display: none;
            width: min(320px, calc(100vw - 28px));
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            background: #2b2a25;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
        }

        .tool-dropdown.open {
            display: block;
        }

        .tool-dropdown h3 {
            margin: 4px 6px 10px;
            color: var(--text);
            font-size: 0.92rem;
        }

        .tool-option {
            width: 100%;
            margin-bottom: 6px;
            padding: 9px 10px;
            border: 0;
            border-radius: 12px;
            cursor: pointer;
            color: var(--text);
            background: rgba(255, 255, 255, 0.05);
            text-align: left;
        }

        .tool-option:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .tool-option small {
            display: block;
            margin-top: 2px;
            color: var(--muted);
        }

        .effort-menu {
            position: relative;
        }

        .effort-dropdown {
            position: absolute;
            right: 0;
            bottom: 48px;
            z-index: 10;
            display: none;
            width: 120px;
            padding: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            background: #2b2a25;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
        }

        .effort-dropdown.open {
            display: block;
        }

        .effort-option {
            width: 100%;
            margin-bottom: 4px;
            padding: 8px 12px;
            border: 0;
            border-radius: 10px;
            cursor: pointer;
            color: var(--text);
            background: transparent;
            text-align: left;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .effort-option:last-child {
            margin-bottom: 0;
        }

        .effort-option:hover,
        .effort-option.selected {
            background: rgba(255, 255, 255, 0.12);
        }

        @media (max-width: 640px) {
            .top-area {
                padding-top: 10vh;
            }
            .bear-logo {
                font-size: clamp(0.6rem, 3.5vw, 1.2rem);
            }
            .effort-selector {
                display: none;
            }
        }
    </style>
</head>
<body>
    <main class="app">
        <section class="top-area">
            <pre class="bear-logo">████╗  █████╗ █████╗  ████╗   
██╔═██╗██╔══╝ ██╔══██╗██╔═██╗ 
█████╔╝████╗  ███████║█████╔╝ 
██╔═██╗██╔═╝  ██╔══██║██╔═██╗ 
█████╔╝█████╗ ██║  ██║██║  ██║
╚════╝ ╚════╝ ╚═╝  ╚═╝╚═╝  ╚═╝</pre>

            <div class="chat-shell">
                <form class="chat-box" id="chatForm" autocomplete="off">
                    
                    <!-- Left: Plus Button & Tool Menu -->
                    <div class="tool-menu">
                        <button class="icon-button" id="plusButton" type="button" title="Add attachment">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                        </button>

                        <div class="tool-dropdown" id="toolDropdown">
                            <h3>Select Ollama Model</h3>
                            <button type="button" class="tool-option">Llama 3 <small>8B Parameters</small></button>
                            <button type="button" class="tool-option">Mistral <small>7B Parameters</small></button>
                            <button type="button" class="tool-option">Gemma 2 <small>9B Parameters</small></button>
                            <button type="button" class="tool-option">Mixtral <small>8x7B Parameters</small></button>
                        </div>
                    </div>

                    <!-- Center: Expanding Textarea -->
                    <textarea id="prompt" rows="1" placeholder="Ask Bear"></textarea>

                    <!-- Right: Effort Selector and Send Button -->
                    <div class="right-controls">
                        <div class="effort-menu">
                            <div class="effort-selector" id="effortSelector" title="Select Effort">
                                Effort: <span id="effortLabel">Low</span>
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="6 9 12 15 18 9"></polyline>
                                </svg>
                            </div>
                            
                            <!-- Effort Dropdown -->
                            <div class="effort-dropdown" id="effortDropdown">
                                <button type="button" class="effort-option selected" data-value="Low">Low</button>
                                <button type="button" class="effort-option" data-value="Medium">Medium</button>
                                <button type="button" class="effort-option" data-value="High">High</button>
                                <button type="button" class="effort-option" data-value="Max">Max</button>
                            </div>
                        </div>
                        
                        <!-- Send Button (Up Arrow) -->
                        <button class="icon-button send-button" id="sendButton" type="submit" title="Send message">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="19" x2="12" y2="5"></line>
                                <polyline points="5 12 12 5 19 12"></polyline>
                            </svg>
                        </button>
                    </div>
                </form>
            </div>
        </section>

        <section class="messages" id="messages"></section>
    </main>

    <script>
        const chatForm = document.getElementById("chatForm");
        const promptBox = document.getElementById("prompt");
        const sendButton = document.getElementById("sendButton");
        const plusButton = document.getElementById("plusButton");
        const toolDropdown = document.getElementById("toolDropdown");
        const effortSelector = document.getElementById("effortSelector");
        const effortDropdown = document.getElementById("effortDropdown");
        const effortLabel = document.getElementById("effortLabel");
        const effortOptions = document.querySelectorAll(".effort-option");

        // Toggle tool dropdown
        plusButton.addEventListener("click", () => {
            toolDropdown.classList.toggle("open");
            effortDropdown.classList.remove("open");
        });

        // Toggle effort dropdown
        effortSelector.addEventListener("click", () => {
            effortDropdown.classList.toggle("open");
            toolDropdown.classList.remove("open");
        });

        // Handle effort option selection
        effortOptions.forEach(option => {
            option.addEventListener("click", (e) => {
                effortOptions.forEach(opt => opt.classList.remove("selected"));
                e.target.classList.add("selected");
                effortLabel.textContent = e.target.getAttribute("data-value");
                effortDropdown.classList.remove("open");
            });
        });

        // Close dropdowns when clicking outside
        document.addEventListener("click", (e) => {
            if (!plusButton.contains(e.target) && !toolDropdown.contains(e.target)) {
                toolDropdown.classList.remove("open");
            }
            if (!effortSelector.contains(e.target) && !effortDropdown.contains(e.target)) {
                effortDropdown.classList.remove("open");
            }
        });

        // Auto-resize textarea and activate Send button
        promptBox.addEventListener("input", function() {
            this.style.height = "24px";
            this.style.height = Math.min(this.scrollHeight, 150) + "px";
            
            if (this.value.trim() !== "") {
                sendButton.classList.add("active");
            } else {
                sendButton.classList.remove("active");
            }
        });

        // Handle sending the message
        chatForm.addEventListener("submit", (e) => {
            e.preventDefault();
            if (promptBox.value.trim() !== "") {
                promptBox.value = "";
                promptBox.style.height = "24px";
                sendButton.classList.remove("active");
                toolDropdown.classList.remove("open");
            }
        });

        // Submit on enter (but allow shift+enter for new lines)
        promptBox.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                if (promptBox.value.trim() !== "") {
                    chatForm.dispatchEvent(new Event("submit"));
                }
            }
        });
    </script>
</body>
</html>
