<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEAR</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            color-scheme: dark;
            --text: #e3e3e3;
            --muted: #a0a0a0;
            --accent: #a78bfa;
            --panel: #1e1f22;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #0b0d14;
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system,
                BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .app {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .top-area {
            width: min(100% - 24px, 800px);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 22vh;
            transition: padding-top 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .app.chat-active .top-area {
            padding-top: 20px;
        }

        .bear-logo {
            margin: 0 0 35px;
            color: var(--accent);
            font-family: "Courier New", monospace;
            font-weight: 700;
            font-size: clamp(0.9rem, 2.5vw, 1.8rem);
            line-height: 1.15;
            letter-spacing: 0.1em;
            text-align: center;
            white-space: pre;
            text-shadow: 0 0 25px rgba(167, 139, 250, 0.4);
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.5s ease, transform 0.5s ease, margin 0.5s ease, max-height 0.5s ease;
            max-height: 200px;
        }

        .app.chat-active .bear-logo {
            opacity: 0;
            transform: translateY(-20px);
            margin: 0;
            max-height: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .chat-shell {
            width: min(100%, 720px);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .app.chat-active .chat-shell {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }

        .chat-box {
            width: 100%;
            min-height: 52px;
            padding: 8px 12px;
            border-radius: 26px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: var(--panel);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: flex-end;
            gap: 12px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .chat-box:focus-within {
            background: #232428;
            border-color: rgba(255, 255, 255, 0.15);
        }

        textarea {
            flex: 1;
            min-height: 24px;
            height: 24px;
            max-height: 150px;
            resize: none;
            border: 0;
            outline: 0;
            background: transparent;
            color: var(--text);
            font: inherit;
            font-size: 1rem;
            padding: 0;
            line-height: 24px;
            margin: 6px 0;
            overflow: hidden;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        textarea::-webkit-scrollbar {
            display: none;
        }

        textarea::placeholder {
            color: var(--muted);
        }

        .right-controls {
            display: flex;
            align-items: center;
            gap: 4px;
            padding-bottom: 0px;
        }

        .effort-selector {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: var(--muted);
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 12px;
            transition: background 0.2s, color 0.2s;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        .effort-selector:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
        }

        .icon-button {
            width: 36px;
            height: 36px;
            border: 0;
            border-radius: 50%;
            cursor: pointer;
            display: grid;
            place-items: center;
            flex: 0 0 36px;
            background: transparent;
            color: var(--muted);
            transition: all 0.2s ease;
        }

        .icon-button:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
        }

        .send-button {
            display: grid;
            background: rgba(255, 255, 255, 0.1);
            color: var(--muted);
            pointer-events: none;
            transition: all 0.2s ease;
        }

        .send-button.active {
            background: #f1efe9;
            color: #1a1a1a;
            pointer-events: auto;
        }

        .send-button.active:hover {
            background: #ffffff;
        }

        .tool-menu {
            position: relative;
        }

        .tool-dropdown {
            position: absolute;
            left: 0;
            bottom: 52px;
            z-index: 110;
            display: none;
            width: min(340px, calc(100vw - 28px));
            max-height: 380px;
            overflow-y: auto;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            background: #2b2a25;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
        }

        .tool-dropdown.open {
            display: block;
        }

        .tool-dropdown h3 {
            margin: 8px 6px 6px;
            color: var(--text);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            opacity: 0.7;
        }

        .tool-dropdown h3:first-child {
            margin-top: 0;
        }

        .tool-dropdown p {
            margin: 4px 6px;
            color: var(--muted);
            font-size: 0.85rem;
        }

        .tool-option {
            width: 100%;
            margin-bottom: 4px;
            padding: 8px 10px;
            border: 0;
            border-radius: 10px;
            cursor: pointer;
            color: var(--text);
            background: rgba(255, 255, 255, 0.05);
            text-align: left;
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .tool-option:hover,
        .tool-option.selected {
            background: rgba(255, 255, 255, 0.12);
        }

        .effort-menu {
            position: relative;
        }

        .effort-dropdown {
            position: absolute;
            right: 0;
            bottom: 48px;
            z-index: 110;
            display: none;
            width: 130px;
            padding: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            background: #2b2a25;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
        }

        .effort-dropdown.open {
            display: block;
        }

        .effort-option {
            width: 100%;
            margin-bottom: 4px;
            padding: 8px 12px;
            border: 0;
            border-radius: 10px;
            cursor: pointer;
            color: var(--text);
            background: transparent;
            text-align: left;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .effort-option:last-child {
            margin-bottom: 0;
        }

        .effort-option:hover,
        .effort-option.selected {
            background: rgba(255, 255, 255, 0.12);
        }

        .messages {
            width: min(100% - 24px, 720px);
            margin-top: 10px;
            overflow-y: auto;
            padding-bottom: 110px;
            flex: 1;
            display: none;
        }

        .app.chat-active .messages {
            display: block;
        }

        .message {
            width: fit-content;
            margin: 16px 0;
            line-height: 1.5;
            overflow-wrap: anywhere;
            display: flex;
            flex-direction: column;
        }

        .user-message {
            max-width: 80%;
            margin-left: auto;
            background: #332d4d;
            color: #ffffff;
            padding: 10px 16px;
            border-radius: 18px;
            border-bottom-right-radius: 4px;
            white-space: pre-wrap;
        }

        .assistant-message {
            max-width: 100%;
            margin-right: auto;
            background: transparent;
            padding: 0;
            white-space: pre-wrap;
            color: var(--text);
        }

        .error-message {
            max-width: 100%;
            margin-right: auto;
            color: #ffb4ab;
            background: transparent;
            padding: 0;
            white-space: pre-wrap;
        }

        .tool-badge {
            align-self: flex-start;
            color: var(--muted);
            font-size: 0.78rem;
            font-weight: 500;
            margin-bottom: 6px;
            padding: 0;
            border: none;
            background: transparent;
            opacity: 0.85;
        }

        .system-status {
            position: fixed;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            color: var(--muted);
            opacity: 0.7;
            pointer-events: none;
            z-index: 90;
        }

        @media (max-width: 640px) {
            .top-area {
                padding-top: 15vh;
            }
            .bear-logo {
                font-size: clamp(0.6rem, 3.5vw, 1.2rem);
            }
            .effort-selector {
                display: none;
            }
        }
    </style>
</head>
<body>
    <main class="app" id="app">
        <section class="top-area">
            <pre class="bear-logo">████╗  █████╗ █████╗  ████╗   
██╔═██╗██╔══╝ ██╔══██╗██╔═██╗ 
█████╔╝████╗  ███████║█████╔╝ 
██╔═██╗██╔═╝  ██╔══██║██╔═██╗ 
█████╔╝█████╗ ██║  ██║██║  ██║
╚════╝ ╚════╝ ╚═╝  ╚═╝╚═╝  ╚═╝</pre>

            <div class="chat-shell">
                <form class="chat-box" id="chatForm" autocomplete="off">

                    <div class="tool-menu">
                        <button class="icon-button" id="plusButton" type="button" title="Select Model & Tools">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                        </button>

                        <div class="tool-dropdown" id="toolDropdown">
                            <p>Loading options...</p>
                        </div>
                    </div>

                    <textarea id="prompt" rows="1" placeholder="Ask Bear"></textarea>

                    <div class="right-controls">
                        <div class="effort-menu">
                            <div class="effort-selector" id="effortSelector" title="Select Effort">
                                Effort: <span id="effortLabel">Low</span>
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="6 9 12 15 18 9"></polyline>
                                </svg>
                            </div>

                            <div class="effort-dropdown" id="effortDropdown"></div>
                        </div>

                        <button class="icon-button send-button" id="sendButton" type="submit" title="Send message">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="19" x2="12" y2="5"></line>
                                <polyline points="5 12 12 5 19 12"></polyline>
                            </svg>
                        </button>
                    </div>
                </form>
            </div>
        </section>

        <section class="messages" id="messages"></section>

        <div class="system-status" id="statusText">Connected</div>
    </main>

    <script>
        const app = document.getElementById("app");
        const chatForm = document.getElementById("chatForm");
        const promptBox = document.getElementById("prompt");
        const sendButton = document.getElementById("sendButton");
        const messages = document.getElementById("messages");
        const plusButton = document.getElementById("plusButton");
        const toolDropdown = document.getElementById("toolDropdown");
        const effortSelector = document.getElementById("effortSelector");
        const effortDropdown = document.getElementById("effortDropdown");
        const effortLabel = document.getElementById("effortLabel");
        const statusText = document.getElementById("statusText");

        const API_BASE = window.location.protocol === "file:" ? "http://127.0.0.1:8765" : "";
        statusText.textContent = `Connected to ${API_BASE || window.location.origin}`;

        let availableModels = [];
        let availableTools = [];
        let selectedModel = null;
        let selectedTool = null;
        let selectedEffort = "Low";
        let isSending = false;

        function triggerActiveChatLayout() {
            if (!app.classList.contains("chat-active")) {
                app.classList.add("chat-active");
            }
        }

        function addMessage(text, type, toolsUsed = []) {
            triggerActiveChatLayout();
            const bubble = document.createElement("div");
            bubble.className = `message ${type}-message`;

            if (toolsUsed && toolsUsed.length > 0) {
                const badge = document.createElement("div");
                badge.className = "tool-badge";
                badge.textContent = `Tools Used: ${toolsUsed.join(', ')}`;
                bubble.appendChild(badge);
            }

            const textNode = document.createElement("div");
            textNode.textContent = text;
            bubble.appendChild(textNode);

            messages.appendChild(bubble);
            messages.scrollTop = messages.scrollHeight;
            return bubble;
        }

        function setSendState() {
            sendButton.classList.toggle("active", promptBox.value.trim().length > 0 && !isSending);
            sendButton.disabled = isSending;
        }

        function renderToolDropdown() {
            toolDropdown.innerHTML = "";

            const modelHeader = document.createElement("h3");
            modelHeader.textContent = "Select Model";
            toolDropdown.appendChild(modelHeader);

            if (!availableModels.length) {
                const empty = document.createElement("p");
                empty.textContent = "No models available.";
                toolDropdown.appendChild(empty);
            } else {
                availableModels.forEach((model) => {
                    const button = document.createElement("button");
                    button.type = "button";
                    button.className = "tool-option";
                    if (model === selectedModel) button.classList.add("selected");
                    button.textContent = model;
                    button.addEventListener("click", () => {
                        selectedModel = model;
                        renderToolDropdown();
                    });
                    toolDropdown.appendChild(button);
                });
            }

            const toolHeader = document.createElement("h3");
            toolHeader.textContent = "Tool Mode";
            toolDropdown.appendChild(toolHeader);

            const autoBtn = document.createElement("button");
            autoBtn.type = "button";
            autoBtn.className = "tool-option";
            if (!selectedTool) autoBtn.classList.add("selected");
            autoBtn.textContent = "Auto Tool Selection";
            autoBtn.addEventListener("click", () => {
                selectedTool = null;
                renderToolDropdown();
            });
            toolDropdown.appendChild(autoBtn);

            availableTools.forEach((t) => {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "tool-option";
                if (selectedTool === t.name) button.classList.add("selected");
                button.textContent = `Force: ${t.name}`;
                button.addEventListener("click", () => {
                    selectedTool = t.name;
                    renderToolDropdown();
                });
                toolDropdown.appendChild(button);
            });
        }

        async function loadConfig() {
            try {
                const response = await fetch(`${API_BASE}/api/config`);
                const config = await response.json();
                selectedEffort = config.default_effort || "Low";
                effortLabel.textContent = selectedEffort;

                effortDropdown.innerHTML = "";
                const efforts = config.efforts || {
                    "Low": { label: "Low" },
                    "Medium": { label: "Medium" },
                    "High": { label: "High" },
                    "Max": { label: "Max" }
                };

                Object.entries(efforts).forEach(([value, data]) => {
                    const button = document.createElement("button");
                    button.type = "button";
                    button.className = "effort-option";
                    button.dataset.value = value;
                    button.textContent = data.label || value;
                    if (value === selectedEffort) button.classList.add("selected");
                    button.addEventListener("click", () => {
                        selectedEffort = value;
                        effortLabel.textContent = data.label || value;
                        document.querySelectorAll(".effort-option").forEach(item => item.classList.remove("selected"));
                        button.classList.add("selected");
                        effortDropdown.classList.remove("open");
                    });
                    effortDropdown.appendChild(button);
                });
            } catch (e) {
                effortDropdown.innerHTML = "";
                ["Low", "Medium", "High", "Max"].forEach(val => {
                    const button = document.createElement("button");
                    button.type = "button";
                    button.className = "effort-option";
                    if (val === "Low") button.classList.add("selected");
                    button.textContent = val;
                    button.addEventListener("click", () => {
                        selectedEffort = val;
                        effortLabel.textContent = val;
                        document.querySelectorAll(".effort-option").forEach(item => item.classList.remove("selected"));
                        button.classList.add("selected");
                        effortDropdown.classList.remove("open");
                    });
                    effortDropdown.appendChild(button);
                });
            }
        }

        async function loadModels() {
            try {
                const response = await fetch(`${API_BASE}/api/models`);
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || "Could not load models.");
                availableModels = data.models || [];
                selectedModel = availableModels[0] || null;
            } catch (error) {
                availableModels = [];
                statusText.textContent = "Error fetching models from server.";
            }
        }

        async function loadTools() {
            try {
                const response = await fetch(`${API_BASE}/api/tools`);
                const tools = await response.json();
                if (Array.isArray(tools)) {
                    availableTools = tools;
                }
            } catch (err) {
                availableTools = [];
            }
        }

        plusButton.addEventListener("click", () => {
            toolDropdown.classList.toggle("open");
            effortDropdown.classList.remove("open");
        });

        effortSelector.addEventListener("click", () => {
            effortDropdown.classList.toggle("open");
            toolDropdown.classList.remove("open");
        });

        document.addEventListener("click", event => {
            if (!plusButton.contains(event.target) && !toolDropdown.contains(event.target)) {
                toolDropdown.classList.remove("open");
            }
            if (!effortSelector.contains(event.target) && !effortDropdown.contains(event.target)) {
                effortDropdown.classList.remove("open");
            }
        });

        promptBox.addEventListener("input", () => {
            promptBox.style.height = "24px";
            promptBox.style.height = `${Math.min(promptBox.scrollHeight, 150)}px`;
            setSendState();
        });

        chatForm.addEventListener("submit", async event => {
            event.preventDefault();
            const message = promptBox.value.trim();
            if (!message || isSending) return;

            triggerActiveChatLayout();

            isSending = true;
            setSendState();
            addMessage(message, "user");
            promptBox.value = "";
            promptBox.style.height = "24px";
            statusText.textContent = "Bear is thinking...";

            try {
                const response = await fetch(`${API_BASE}/api/chat`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        message,
                        model: selectedModel,
                        effort: selectedEffort,
                        tool: selectedTool
                    })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || "Chat request failed.");

                addMessage(data.reply || "Bear returned an empty response.", "assistant", data.tools_used);
                statusText.textContent = `Connected to ${API_BASE || window.location.origin}`;
            } catch (error) {
                addMessage(`Error: ${error.message}`, "error");
                statusText.textContent = "Failed to fetch response.";
            } finally {
                isSending = false;
                setSendState();
                promptBox.focus();
            }
        });

        promptBox.addEventListener("keydown", event => {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                chatForm.requestSubmit();
            }
        });

        async function init() {
            await Promise.all([loadConfig(), loadModels(), loadTools()]);
            renderToolDropdown();
        }

        init().catch(error => {
            addMessage(`Startup error: ${error.message}`, "error");
        });
    </script>
</body>
</html>
